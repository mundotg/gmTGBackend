services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minha-api

    ports:
      - "8000:8000"

    volumes:
      - .:/app
      - /app/node_modules # evita sobrescrever deps (caso uses Node misturado)

    # ⚠️ Aqui NÃO se usa `env_file: .env` — isso corromperia a SECRET_KEY e a
    # ENCRYPTION_KEY.
    #
    # O Compose interpola `$` nos valores do env_file. Ambas as chaves contêm
    # `$O`, que é expandido para a variável `O` (inexistente) e substituído por
    # vazio — sem erro, apenas um aviso "The 'O' variable is not set":
    #
    #   .env          wjwjwPk^Fb9X_La$O%3XzRCUmd*...
    #   no contentor  wjwjwPk^Fb9X_La%3XzRCUmd*...
    #
    # Consequência: os JWT assinados dentro do Docker não são aceites fora, e
    # as credenciais das ligações guardadas na base não podem ser
    # desencriptadas.
    #
    # Não é preciso substituto: o bind mount `.:/app` acima já traz o .env, e a
    # app lê-o com python-dotenv (app/config/dotenv.py), que não toca em `$O`.
    #
    # Para subir back e front juntos, usar o docker-compose.yml da raiz do
    # repositório.

    environment:
      - PYTHONPATH=/app

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app

    # melhora compatibilidade de hot reload no Windows
    tty: true
    stdin_open: true
