[project]
name = "gmtg-backend"
version = "0.1.0"
description = "Backend FastAPI para gestão e análise de bases de dados"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

exclude = [
    ".git",
    "venv",
    ".venv",
    "__pycache__",
    "alembic/versions",
    "build",
    "dist",
]

[tool.ruff.lint]
# Conjunto deliberadamente moderado: o objetivo é apanhar erros reais
# (variáveis por definir, imports partidos, except silenciosos) sem inundar
# uma base de código de 35k linhas com milhares de avisos de estilo.
select = [
    "E4",   # imports
    "E7",   # statements
    "E9",   # erros de sintaxe/runtime
    "F",    # pyflakes — nomes indefinidos, imports/variáveis por usar
    "B",    # bugbear — armadilhas comuns
    "S",    # bandit — problemas de segurança
    "UP",   # pyupgrade — sintaxe obsoleta
    "I",    # ordenação de imports
]

ignore = [
    "E501",    # comprimento de linha: tratado pelo formatter
    "B008",    # chamada no default do argumento — é o padrão do FastAPI (Depends)
    "S101",    # assert — legítimo em testes
    "S104",    # bind em 0.0.0.0 — intencional em contentores
    "UP007",   # Optional[X] vs X | None — migração gradual
]

[tool.ruff.lint.per-file-ignores]
# Os seeds e scripts imprimem para consola de propósito.
"app/seed_*.py" = ["S105", "S106"]
"scripts/*.py" = ["S105", "S106"]
# Testes podem usar credenciais fictícias e asserts à vontade.
"tests/*.py" = ["S105", "S106", "S107"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
