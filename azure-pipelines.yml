# Pipeline CI do backend gmTG.
#
# Corria antes numa matriz Python 3.8–3.11 e invocava `pytest` sem existirem
# testes — o que dava sempre verde e não verificava absolutamente nada.
# O projeto exige >=3.12 (usa `X | None`, `datetime.UTC` e SQLAlchemy 2.x),
# pelo que a matriz antiga nem sequer conseguiria importar a aplicação.

trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  # Versão única: é a que o Dockerfile usa (python:3.12-slim).
  pythonVersion: "3.12"

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "$(pythonVersion)"
    displayName: "Python $(pythonVersion)"

  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install ruff pytest pytest-azurepipelines
    displayName: "Instalar dependências"

  - script: ruff check app scripts --output-format=github
    displayName: "Lint (ruff)"
    # Ainda há dívida técnica acumulada; o lint reporta mas não trava o build.
    # Remover esta linha assim que a contagem de avisos chegar a zero.
    continueOnError: "true"

  - script: ruff format --check app scripts
    displayName: "Formatação (ruff format)"
    continueOnError: "true"

  - script: |
      python -c "from app.main import app; print(f'{len(app.routes)} rotas registadas')"
    displayName: "Smoke test — a aplicação importa"
    env:
      # Valores só para o CI: a app recusa arrancar sem eles.
      SECRET_KEY: ci-secret-nao-usar-em-producao
      ALGORITHM: HS256
      ENCRYPTION_KEY: ci-encryption-key-nao-usar-em-producao
      DATABASE_URL: sqlite:///./ci_test.db
      ENV: development

  - script: pytest
    displayName: "Testes"
    env:
      SECRET_KEY: ci-secret-nao-usar-em-producao
      ALGORITHM: HS256
      ENCRYPTION_KEY: ci-encryption-key-nao-usar-em-producao
      DATABASE_URL: sqlite:///./ci_test.db
      ENV: development
